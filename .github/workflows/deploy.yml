name: deploy

# Build the web client and publish it to GitHub Pages on a push to ANY branch
# (matches the working setup in RubenTipparach/sea-of-lost-souls). The most recent
# push wins the site root. Uses peaceiris to push the built bundle to the
# `gh-pages` branch — this works from any branch, unlike actions/deploy-pages,
# which is pinned to the `github-pages` environment / default branch.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

# peaceiris needs to push the built site to the gh-pages branch.
permissions:
  contents: write

# Serialize deploys so concurrent pushes don't race on the gh-pages branch.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust + wasm target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown
      - name: Install trunk
        run: |
          curl -fsSL https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xzf - -C "$HOME/.cargo/bin" trunk
          trunk --version
      - name: Build web bundle
        run: cd apps/client && trunk build --release --public-url /rts-99-jam/
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/client/dist
          force_orphan: true
