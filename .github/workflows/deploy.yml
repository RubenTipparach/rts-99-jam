name: deploy

# Deploy the wasm client to GitHub Pages using the "GitHub Actions" Pages source.
# Runs on every branch.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable + wasm target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2

      - name: Install trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: latest

      - name: Build web client (wasm)
        working-directory: apps/client
        run: trunk build --release --public-url /rts-99-jam/

      # Publish the browser map editor (dev tool) and the raw .vxl presets it
      # loads, alongside the game, at /rts-99-jam/tools/mapeditor/. The maps are
      # also embedded in the wasm; the editor needs them as fetchable files.
      - name: Bundle the map editor + its .vxl presets and tiles
        run: |
          mkdir -p apps/client/dist/tools/mapeditor apps/client/dist/assets/maps
          mkdir -p apps/client/dist/assets/textures/worlds
          cp tools/mapeditor/index.html apps/client/dist/tools/mapeditor/
          cp assets/maps/*.vxl apps/client/dist/assets/maps/
          cp -r assets/textures/worlds/* apps/client/dist/assets/textures/worlds/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
