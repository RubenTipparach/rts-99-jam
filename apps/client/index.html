<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Astromancers</title>
    <!-- Mobile debugging: append ?debug (or ?eruda) to the URL to load the eruda
         on-screen console. Off by default so normal players don't fetch it. -->
    <script>
      if (/[?&](debug|eruda)\b/.test(location.search)) {
        var s = document.createElement("script");
        s.src = "https://cdn.jsdelivr.net/npm/eruda";
        s.onload = function () { window.eruda && eruda.init(); };
        document.head.appendChild(s);
      }
    </script>
    <meta name="description" content="Astromancers - Space · Magic · Real-Time Strategy." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Astromancers" />
    <meta property="og:description" content="Space · Magic · Real-Time Strategy" />
    <meta property="og:image" content="https://rubentipparach.github.io/rts-99-jam/social-card.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Astromancers" />
    <meta name="twitter:description" content="Space · Magic · Real-Time Strategy" />
    <meta name="twitter:image" content="https://rubentipparach.github.io/rts-99-jam/social-card.png" />
    <style>
      html, body { margin: 0; height: 100%; width: 100%; overflow: hidden; background: #070b14; }
      canvas { display: block; touch-action: none; }
      /* The HUD buffer is sized in PHYSICAL pixels; without an explicit CSS size
         an absolutely-positioned canvas renders at its intrinsic (buffer) size,
         which on any DPI > 1 screen overflows the viewport (broken menus on
         phones / HiDPI desktops). Pin it to the viewport. */
      #hud { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
      /* Mobile test controls - DOM is allowed ONLY here, so a developer can drive
         desktop interactions (pan / zoom / right-click) from a touch device.
         All real game UI lives in WASM. Hidden unless the pointer is coarse,
         and hidden on the menu screens (Rust toggles body.menu). */
      #mobile { display: none; position: fixed; inset: 0; z-index: 15; pointer-events: none; }
      @media (pointer: coarse) { #mobile { display: block; } }
      body.menu #mobile { display: none; }
      #mobile button {
        position: absolute; pointer-events: auto; touch-action: none; user-select: none;
        width: 56px; height: 56px; border-radius: 12px;
        border: 1px solid rgba(150, 180, 220, 0.4); background: rgba(12, 20, 38, 0.55);
        color: #cfe0ff; font: 600 20px/1 ui-monospace, Menlo, Consolas, monospace;
        -webkit-tap-highlight-color: transparent;
      }
      #mobile button:active { background: rgba(40, 70, 120, 0.85); }
      #mobile #rc-toggle.on { background: #c8553a; color: #fff; border-color: #ffd9a0; }
      /* The pan stick: a fixed circular base; Rust drags the knob and reads
         the analog deflection. */
      #stick {
        position: absolute; left: 18px; bottom: 24px; width: 132px; height: 132px;
        border-radius: 50%; border: 1px solid rgba(150, 180, 220, 0.4);
        background: rgba(12, 20, 38, 0.45);
        pointer-events: auto; touch-action: none; user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #stick-knob {
        position: absolute; left: 50%; top: 50%; width: 56px; height: 56px;
        margin: -28px 0 0 -28px; border-radius: 50%;
        border: 1px solid rgba(170, 200, 240, 0.6); background: rgba(40, 70, 120, 0.8);
        pointer-events: none;
      }
      #zoom-in   { right: 18px; bottom: 152px; }
      #zoom-out  { right: 18px; bottom: 88px;  }
      #rc-toggle { right: 86px; bottom: 88px; width: 64px; font-size: 15px; }
      /* Loading screen shown until the first frame renders. */
      #loading {
        position: fixed; inset: 0; z-index: 20;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: radial-gradient(130% 130% at 50% 28%, #11203f 0%, #0a1022 55%, #04060c 100%);
        color: #e7eefa; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        transition: opacity 0.4s ease;
      }
      #loading .title { font-size: clamp(26px, 7vw, 40px); font-weight: 800; letter-spacing: 6px; color: #ffb454; text-shadow: 0 2px 14px #000; }
      #loading .sub { margin-top: 10px; font-size: 13px; letter-spacing: 4px; color: #8aa3cc; }
      #loading .ring { margin-top: 28px; width: 46px; height: 46px; border-radius: 50%;
        border: 4px solid rgba(120, 160, 210, 0.22); border-top-color: #ffb454; animation: spin 0.9s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <link data-trunk rel="icon" href="favicon.png" />
    <link data-trunk rel="copy-file" href="social-card.png" />
    <link data-trunk rel="rust" />
  </head>
  <body>
    <canvas id="hud"></canvas>
    <div id="mobile">
      <div id="stick" aria-label="pan stick"><div id="stick-knob"></div></div>
      <button id="zoom-in" aria-label="zoom in">＋</button>
      <button id="zoom-out" aria-label="zoom out">－</button>
      <button id="rc-toggle" aria-label="right-click mode">RMB</button>
    </div>
    <div id="loading">
      <div class="title">ASTROMANCERS</div>
      <div class="sub">DEPLOYING FORCES…</div>
      <div class="ring"></div>
    </div>
  </body>
</html>
