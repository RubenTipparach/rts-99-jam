<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sol Dominion — rts-99-jam</title>
    <style>
      html, body { margin: 0; height: 100%; width: 100%; overflow: hidden; background: #070b14; }
      canvas { display: block; }
      #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
      /* Loading screen shown until the first frame renders. */
      #loading {
        position: fixed; inset: 0; z-index: 20;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: radial-gradient(130% 130% at 50% 28%, #11203f 0%, #0a1022 55%, #04060c 100%);
        color: #e7eefa; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        transition: opacity 0.4s ease;
      }
      #loading .title { font-size: clamp(26px, 7vw, 40px); font-weight: 800; letter-spacing: 6px; color: #ffb454; text-shadow: 0 2px 14px #000; }
      #loading .sub { margin-top: 10px; font-size: 13px; letter-spacing: 4px; color: #8aa3cc; }
      #loading .ring { margin-top: 28px; width: 46px; height: 46px; border-radius: 50%;
        border: 4px solid rgba(120, 160, 210, 0.22); border-top-color: #ffb454; animation: spin 0.9s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <link data-trunk rel="rust" />
  </head>
  <body>
    <canvas id="hud"></canvas>
    <div id="loading">
      <div class="title">SOL DOMINION</div>
      <div class="sub">DEPLOYING FORCES…</div>
      <div class="ring"></div>
    </div>
  </body>
</html>
