<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Astromancy logo"
     font-family="'Eurostile','Bahnschrift','DejaVu Sans','Arial Narrow',sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#0e1b38"/>
      <stop offset="60%" stop-color="#0a1022"/>
      <stop offset="100%" stop-color="#05070f"/>
    </radialGradient>
    <linearGradient id="wm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe9b0"/>
      <stop offset="55%" stop-color="#f3c46a"/>
      <stop offset="100%" stop-color="#e0992f"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- the Astromancy mission patch -->
  <image xlink:href="emblem.png" href="emblem.png" x="182" y="54" width="660" height="660"/>
  <!-- wordmark + tagline -->
  <text x="512" y="852" text-anchor="middle" font-size="112" font-weight="800" letter-spacing="4" fill="url(#wm)">ASTROMANCY</text>
  <text x="512" y="912" text-anchor="middle" font-size="29" font-weight="600" letter-spacing="6" fill="#8aa3cc">SPACE · MAGIC · REAL-TIME STRATEGY</text>
</svg>
