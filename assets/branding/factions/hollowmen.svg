<path d="M240.0,278.0L245.3,292.7L260.9,293.2L248.6,302.8L252.9,317.8L240.0,309.0L227.1,317.8L231.4,302.8L219.1,293.2L234.7,292.7Z" fill="url(#heart)" filter="url(#softglow)" opacity="0.6"/>
