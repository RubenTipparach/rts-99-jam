<circle cx="240" cy="300" r="4.5" fill="#fff6e6"/>

</g>
<circle cx="240" cy="240" r="189" fill="none" stroke="#e9cd84" stroke-width="2.5"/>
<circle cx="240" cy="240" r="184" fill="none" stroke="#5f9fd6" stroke-width="1" opacity="0.4"/>
<text fill="#d6e6fa" font-size="27" font-weight="700" letter-spacing="4"><textPath href="#arcTop" startOffset="50%" text-anchor="middle">HOLLOWMEN</textPath></text>
<text fill="#bcd2ea" font-size="13" font-weight="600" letter-spacing="2"><textPath href="#arcBottom" startOffset="50%" text-anchor="middle">WE MAKE OUR OWN POWER</textPath></text>
<use href="#spark" transform="translate(36,240) scale(0.7) rotate(45)" color="#5f9fd6"/>
<use href="#spark" transform="translate(444,240) scale(0.7) rotate(45)" color="#5f9fd6"/>
</svg>