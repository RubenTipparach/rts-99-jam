<radialGradient id="heart" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#ffffff"/><stop offset="30%" stop-color="#ffd24a"/><stop offset="100%" stop-color="#ff5a2c" stop-opacity="0"/></radialGradient>

</defs>
<circle cx="240" cy="240" r="232" fill="#0b1019" stroke="#e9cd84" stroke-width="3"/>
