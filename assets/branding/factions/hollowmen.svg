  <path d="M205,97 L275,97"/><path d="M150,102 H206"/><path d="M274,102 H330"/>
</g>
<!-- laser + backlight glow behind the head -->
<path d="M228,112 L218,232 L262,232 L252,112 Z" fill="url(#laser)" filter="url(#softglow)" opacity="0.85"/>
<line x1="240" y1="108" x2="240" y2="230" stroke="#fff4d0" stroke-width="4.5" filter="url(#glow)"/>
<circle cx="240" cy="228" r="40" fill="url(#heart)" filter="url(#softglow)" opacity="0.85"/>
