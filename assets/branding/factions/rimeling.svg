  <circle cx="150" cy="146" r="2.6"/><circle cx="330" cy="146" r="2.6"/><circle cx="240" cy="100" r="2.4"/>
  <circle cx="192" cy="150" r="1.8"/><circle cx="288" cy="150" r="1.8"/><circle cx="240" cy="128" r="1.8"/>
</g>
<!-- borrowed flame -->
<ellipse cx="240" cy="176" rx="36" ry="52" fill="url(#fglow)" filter="url(#softglow)"/>
<path d="M240,216 C210,198 214,156 231,128 C235,146 246,144 241,122 C252,140 270,170 263,196 C257,210 250,216 240,216 Z" fill="#ff8a36"/>
<path d="M240,208 C223,197 225,168 237,146 C239,160 248,158 245,144 C254,162 257,182 251,196 C246,205 246,208 240,208 Z" fill="#ffd86a"/>
<path d="M240,200 C232,193 234,176 240,162 C246,178 246,190 240,200 Z" fill="#fff4cc"/>
<!-- chalice: crystalline, flat 2-tone -->
<ellipse cx="240" cy="206" rx="58" ry="12" fill="#08323f"/>
<path d="M182,206 L240,206 L240,292 Z" fill="#5fdcec"/>
<path d="M240,206 L298,206 L240,292 Z" fill="#1f7a90"/>
<g stroke="#0a3744" stroke-width="1.3" opacity="0.55"><path d="M211,206 L240,292"/><path d="M269,206 L240,292"/></g>
<path d="M182,206 A58,12 0 0 1 298,206" fill="none" stroke="#8af0fa" stroke-width="2" opacity="0.85"/>
<path d="M234,292 L240,292 L240,330 L232,330 Z" fill="#5fdcec"/>
<path d="M240,292 L246,292 L248,330 L240,330 Z" fill="#1f7a90"/>
<path d="M196,330 L240,330 L252,356 L184,356 Z" fill="#5fdcec"/>
<path d="M240,330 L284,330 L296,356 L252,356 Z" fill="#1f7a90"/>
<path d="M182,356 L298,356 L294,363 L186,363 Z" fill="#14606f"/>
