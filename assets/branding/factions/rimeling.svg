  <path d="M232,292 L232,330 L184,356 M248,292 L248,330 L296,356"/>
  <path d="M186,363 L294,363"/>
</g>
<!-- ice shards at the base -->
<g fill="#3fb8cc" stroke="#0a3744" stroke-width="1" stroke-linejoin="round">
  <path d="M156,356 L165,330 L174,356 Z"/>
  <path d="M306,356 L315,334 L324,356 Z"/>
  <path d="M140,356 L146,342 L152,356 Z"/><path d="M328,356 L334,342 L340,356 Z"/>
</g>

</g>
<circle cx="240" cy="240" r="189" fill="none" stroke="#e9cd84" stroke-width="2.5"/>
<circle cx="240" cy="240" r="184" fill="none" stroke="#41e7ff" stroke-width="1" opacity="0.4"/>
<text fill="#bfeffb" font-size="27" font-weight="700" letter-spacing="4"><textPath href="#arcTop" startOffset="50%" text-anchor="middle">RIMELING</textPath></text>
<text fill="#bfeffb" font-size="13" font-weight="600" letter-spacing="2"><textPath href="#arcBottom" startOffset="50%" text-anchor="middle">ALL FIRE IS BORROWED</textPath></text>
<use href="#spark" transform="translate(36,240) scale(0.7) rotate(45)" color="#41e7ff"/>
<use href="#spark" transform="translate(444,240) scale(0.7) rotate(45)" color="#41e7ff"/>
</svg>